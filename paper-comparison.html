<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embossed paper comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fff; color: #555; font: 12px/1.5 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 1200px; margin: 0 auto; }
    figure { margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    figcaption { margin-bottom: 16px; width: 100%; }
    img, canvas { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100dvh - 96px); object-fit: contain; }
    @media (max-width: 600px) { body { padding: 16px; } main { gap: 12px; } }
  </style>
  <main>
    <figure><figcaption>Approved image</figcaption><img src="./assets/embossed-paper-frame.png" width="1122" height="1402" alt="Approved subtle embossed paper reference"></figure>
    <figure><figcaption>JavaScript rendering</figcaption><canvas data-paper-relief width="1122" height="1402" role="img" aria-label="Paper rendered from the approved SVG with raised frame paths"></canvas></figure>
  </main>
  <script type="module" src="./paper-relief.mjs"></script>
</html>
