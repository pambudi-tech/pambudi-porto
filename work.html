<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="A project by Ivan Pambudi." />
  <!-- partial:icons -->
  <title>Ivan Pambudi</title>
  <link rel="preload" href="/assets/fonts/syne-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles/pages/work.css" />
  <script type="module" src="/src/pages/project.mjs" blocking="render"></script>
</head>
<body class="project-arriving">
  <nav class="project-nav" aria-label="Project">
    <a class="project-nav-back" href="/#works" aria-label="Back to works">back</a>
    <span class="project-nav-name" data-project="title"></span>
  </nav>
  <div id="surface" aria-hidden="true" aria-busy="true">
    <canvas id="cloth" aria-hidden="true"></canvas>
    <canvas id="embroidery" aria-hidden="true"></canvas>
    <canvas id="gesture" aria-hidden="true"></canvas>
  </div>
  <a class="skip-link" href="#cover">Skip to hero image</a>
  <main class="project-layout">
    <header class="project-opening" aria-labelledby="project-title">
      <div class="project-info">
        <div class="project-intro">
          <h1 id="project-title" data-project="title"></h1>
          <p class="eyebrow" data-project="category"></p>
        </div>
        <dl class="project-facts">
          <div><dt>Client</dt><dd data-project="client"></dd></div>
          <div><dt>Period</dt><dd data-project="period"></dd></div>
          <div><dt>Role</dt><dd data-project="role"></dd></div>
          <div><dt>Scope</dt><dd data-project="scope"></dd></div>
        </dl>
      </div>
      <div class="project-cover"></div>
      <div class="project-overview">
        <p data-project="subtitle"></p>
        <p data-project="overview"></p>
      </div>
    </header>
  </main>
  <!-- Pinned to the bottom of the screen, above whatever scrolls beneath it. -->
  <button class="works-seal project-gallery-seal" type="button" aria-label="gallery">
    <img src="/assets/works-wax-seal.webp" width="1024" height="374" alt="" aria-hidden="true" draggable="false" />
    <span class="works-seal-label">gallery</span>
  </button>

    <!-- partial:stitch-controls -->


  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
