<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dove hover and clock review</title>
<style>
  body { margin: 0; background: white; color: #49483f; font: 13px/1.5 monospace; }
  p { position: fixed; top: 20px; left: 24px; z-index: 2; pointer-events: none; }
  canvas, time { position: fixed; inset: 0; width: 100%; height: 100%; }
  canvas, time { pointer-events: none; }
</style>
<p>Hover either dove to inspect its clock message.<br>Flight poses held for visual review.</p>
<canvas id="cloth"></canvas><canvas id="embroidery"></canvas><canvas id="gesture"></canvas>
<time id="clock"><canvas></canvas></time>
<script type="module">
  import { SurfaceRenderer } from '../render.mjs';
  import { BirdFlight, projectPose } from '../bird.mjs';
  import { DotClock } from '../clock.mjs';
  import { cornerPitch } from '../corners.mjs';
  import { GRID } from '../model.mjs';
  const $ = id => document.getElementById(id);
  const renderer = new SurfaceRenderer($('cloth'), $('embroidery'), $('gesture'));
  const clock = new DotClock($('clock'));
  let bird;
  function resize() {
    const width = innerWidth, height = innerHeight;
    const view = { x: Math.round(width / 2), y: Math.round(height / 2), scale: cornerPitch(width) / GRID };
    renderer.resize(width, height);
    renderer.drawCloth(view);
    bird = new BirdFlight(width, height, view, { paused: true });
    const cells = [.1, .61].flatMap((fraction, index) => projectPose(bird.frames[0], bird.columns, index ? -1 : 1,
      Math.round((width * fraction - view.x) / bird.pitch),
      Math.round((height * .29 - view.y) / bird.pitch)));
    bird.cells = bird.colorize(new Map(cells.map(([col, row]) => [`${col},${row}`, { col, row, progress: 1 }])));
    renderer.drawStitches({ stitches: new Map() }, view, new Map(), bird.cells);
    clock.resize(width, height, view);
  }
  document.addEventListener('pointermove', event => clock.setMessage(bird.hoverMessage(event.clientX, event.clientY)));
  document.documentElement.addEventListener('pointerleave', () => clock.setMessage(''));
  window.addEventListener('resize', resize);
  resize();
</script>
</html>
