<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embroidery thread detail</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #fff; color: #353630; font: 14px/1.5 monospace; }
  main { max-width: 1020px; margin: auto; }
  h1 { font: inherit; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #6b6c65; }
  canvas { display: block; width: 100%; height: auto; }
</style>
<main>
  <h1>Embroidery thread detail</h1>
  <p>Shared thread renderer · enlarged to inspect the cotton strands</p>
  <canvas id="detail" width="2040" height="1220" aria-label="Enlarged cotton cross-stitches and a rose motif using the same thread rendering as the portfolio"></canvas>
</main>
<script type="module">
  import { drawCross, hash } from '../render.mjs';
  import { GRID } from '../model.mjs';
  import { createMotif } from '../motifs.mjs';
  const ctx = document.querySelector('canvas').getContext('2d');
  ctx.scale(2, 2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, 1020, 610);
  for (const [i, color] of ['#982c40', '#c48386', '#788365', '#404d3d', '#353630', '#e5e2da'].entries()) {
    ctx.save();
    ctx.translate(16 + i * 168, 8);
    ctx.scale(4, 4);
    drawCross(ctx, 3, 3, color, i);
    ctx.restore();
  }
  const cells = createMotif('rose');
  const minX = Math.min(...cells.map(c => c.col)), minY = Math.min(...cells.map(c => c.row));
  const maxX = Math.max(...cells.map(c => c.col)), maxY = Math.max(...cells.map(c => c.row));
  const scale = Math.min(960 / ((maxX - minX + 1) * GRID), 410 / ((maxY - minY + 1) * GRID));
  ctx.save();
  ctx.translate((1020 - (maxX - minX + 1) * GRID * scale) / 2, 168);
  ctx.scale(scale, scale);
  for (const {col, row, color} of cells) drawCross(ctx, (col - minX) * GRID, (row - minY) * GRID, color, Math.floor(hash(col, row) * 8));
  ctx.restore();
</script>
</html>
