<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lace generator — review</title>
  <style>
    body { margin: 0; padding: 24px; background: #ffffff; font: 12px "Syne Mono", monospace; color: #49483f; }
    form { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    label { display: grid; gap: 4px; }
    .stage { position: relative; display: inline-block; background: radial-gradient(circle, rgb(0 0 0 / .2) 1.5px, transparent 1.6px) 0 0 / 10px 10px; }
    .stage canvas { position: relative; display: block; filter: drop-shadow(.5px .9px .35px rgb(80 58 32 / .5)) drop-shadow(0 3px 6px rgb(70 55 35 / .1)); }
  </style>
</head>
<body>
  <form>
    <label>panels <input name="count" type="number" min="1" max="8" value="3" /></label>
    <label>direction <select name="orientation"><option>row</option><option>column</option></select></label>
    <label>window width <input name="width" type="number" value="300" /></label>
    <label>window height <input name="height" type="number" value="220" /></label>
    <label>band <input name="band" type="number" value="80" /></label>
  </form>
  <div class="stage"><canvas></canvas></div>
  <script type="module">
    import { drawLace } from '../lace.mjs';
    const form = document.querySelector('form'), canvas = document.querySelector('canvas');
    const params = new URLSearchParams(location.search);
    for (const [key, value] of params) if (form.elements[key]) form.elements[key].value = value;
    const draw = () => {
      const f = form.elements;
      drawLace(canvas, { count: +f.count.value, orientation: f.orientation.value, window: [+f.width.value, +f.height.value], band: +f.band.value },
        { dpr: Math.min(devicePixelRatio || 1, 2) });
    };
    form.addEventListener('input', draw);
    draw();
  </script>
</body>
</html>
