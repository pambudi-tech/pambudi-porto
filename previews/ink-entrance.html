<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink entrance continuity review</title>
  <link rel="stylesheet" href="https://use.typekit.net/ghx2tkl.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    body { display: grid; place-content: center; gap: 48px; background: #080808; color: white; }
    #specimen { position: relative; z-index: 1; text-align: center; }
    #specimen p { position: relative; margin: 0; }
    #script { font: 64px/1.3 "military-scribe"; }
    #mono { margin-top: 32px !important; font: 16px/1.5 "Syne Mono"; }
    nav { position: relative; z-index: 1; display: flex; gap: 8px; justify-content: center; }
    nav button { border: 1px solid #555; background: #171717; color: white; padding: 8px 12px; }
  </style>
</head>
<body>
  <div class="portfolio-paper preloader-paper is-ready" aria-hidden="true"><img class="preloader-frame" src="../assets/pambudi-frame.svg" alt=""></div>
  <div id="specimen"><p id="script">House of Pambudi</p><p id="mono">mostly corporate work lately, but his dream<br>of working in sports hasn’t faded one bit</p></div>
  <nav><button id="replay">Replay</button><button data-stage="0.5">50%</button><button data-stage="0.9">90%</button><button data-stage="1">100%</button><button id="cleanup">Resting text</button></nav>
  <script type="module">
    import { createInkLayer, createImageInkLayer } from '../ink-growth.mjs';
    import { registerPreloaderFrame } from '../frame-registration.mjs';
    const paper = document.querySelector('.preloader-paper img');
    registerPreloaderFrame(paper);
    await Promise.all([document.fonts.ready, paper.decode()]);
    let layers = [], frame;
    const prepare = () => {
      cancelAnimationFrame(frame);
      layers.forEach(layer => layer.finish());
      layers = [...document.querySelectorAll('#specimen p')].map(p => createInkLayer(p, { shapeText: p.id === 'script' }));
      layers.push(createImageInkLayer(paper));
    };
    for (const button of document.querySelectorAll('[data-stage]')) button.onclick = () => { prepare(); layers.forEach(layer => layer.draw(Number(button.dataset.stage))); };
    document.querySelector('#cleanup').onclick = () => { cancelAnimationFrame(frame); layers.forEach(layer => layer.finish()); };
    document.querySelector('#replay').onclick = () => {
      prepare();
      const started = performance.now();
      const draw = now => {
        const progress = Math.min(1, (now - started) / 2500);
        layers.forEach(layer => layer.draw(progress));
        if (progress < 1) frame = requestAnimationFrame(draw);
        else layers.forEach(layer => layer.finish());
      };
      frame = requestAnimationFrame(draw);
    };
  </script>
</body>
</html>
