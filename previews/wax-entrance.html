<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wax entrance review</title>
<link rel="stylesheet" href="../style.css">
<style>
body{overflow:auto;height:auto;background:#faf9f6;color:#49483f;font:14px/1.5 "Syne Mono",monospace}main{max-width:1100px;margin:auto;padding:44px 28px}h1{font:24px Georgia,serif;font-weight:400}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between}.replay{border:1px solid #d9d5cc;border-radius:8px;background:#fff;padding:10px 16px;font:inherit}.stage{height:280px;display:grid;place-items:center}.stage .works-seal{position:relative;left:auto;top:auto;transform:none;width:min(440px,88vw);min-height:0}.stage .works-seal:active{transform:scale(.98)}.stage .works-seal-label{font-size:34px}.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid #ddd8cf;padding-top:24px}.frame{min-width:0}.frame canvas{position:static;width:100%;height:auto}.frame p{font-size:11px;color:#898376}.frame .image{width:100%;display:block}.note{font-size:12px;color:#898376}@media(max-width:600px){.frames{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stage{height:210px}.stage .works-seal-label{font-size:26px}header{gap:20px}h1{font-size:20px}}
</style>
<main>
<header><h1>Soft wax entrance</h1><button class="replay">Replay entrance</button></header>
<p class="note">Soft uneven wax. The original label reveal begins at 50% of the spread, while the rim is still forming.</p>
<div class="stage"><button class="works-seal" aria-label="works"><img src="../assets/works-wax-seal.png" width="2076" height="758" alt=""><span class="works-seal-label">works</span></button></div>
<div class="frames"></div>
<p class="note"><a href="/?wax-preview">View on the homepage →</a></p>
</main>
<script type="module">
import {WaxInteraction} from '../wax-interaction.mjs';
import {WaxEntrance,drawWaxSpread} from '../wax-entrance.mjs';
const seal=document.querySelector('.works-seal'),image=seal.querySelector('img');
const preference=matchMedia('(prefers-reduced-motion: reduce)');
const wax=new WaxInteraction(seal,preference);
document.querySelector('.replay').addEventListener('click',()=>{wax.entrance.finish();wax.entrance=new WaxEntrance(seal,preference);});
await image.decode();
for(const [progress,label] of [[.08,'01 · Center pool'],[.2,'02 · Wax spreads'],[.38,'03 · Rim forms'],[.94,'04 · Settled silhouette']]){
 const frame=document.createElement('div');frame.className='frame';
 const canvas=document.createElement('canvas');canvas.width=768;canvas.height=280;
 const mask=document.createElement('canvas');mask.width=768;mask.height=280;
 const state=drawWaxSpread(canvas.getContext('2d'),image,progress,mask);
 const artwork=document.createElement('div');artwork.style.cssText='position:relative;display:grid;place-items:center';
 const lettering=document.createElement('span');lettering.className='works-seal-label';lettering.textContent='works';
 lettering.style.cssText=`position:absolute;font-size:20px;opacity:${state.label};filter:blur(${(1-state.label)*.7}px)`;
 artwork.append(canvas,lettering);
 const caption=document.createElement('p');caption.textContent=label;
 frame.append(artwork,caption);document.querySelector('.frames').append(frame);
}
</script>
</html>
