<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reference motifs · Cross-stitch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8f7f4; color: #514b44; font: 12px/1.5 ui-monospace, monospace; }
  main { max-width: 1180px; margin: 0 auto; padding: 22px; }
  h1 { margin: 0; font-size: 17px; font-weight: 500; }
  p { margin: 5px 0 18px; color: #887f74; }
  #motifs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  button { display: block; width: 100%; padding: 0 0 10px; background: white; border: 1px solid #e5e0d8; border-radius: 3px; font: inherit; color: inherit; cursor: pointer; }
  .comparison { display: grid; grid-template-columns: 1fr 1fr; height: 238px; }
  .source-pane { display: grid; place-items: center; overflow: hidden; }
  .source-crop { position: relative; overflow: hidden; }
  .source-crop img { position: absolute; max-width: none; }
  canvas { display: block; width: 100%; height: 238px; }
  .labels { display: grid; grid-template-columns: 1fr 1fr; font-size: 9px; color: #aaa196; margin-top: -12px; margin-bottom: 5px; }
  small { display: block; color: #887f74; font-size: 10px; }
  @media (max-width: 700px) { #motifs { grid-template-columns: 1fr; } main { padding: 14px; } }
</style>
<main>
  <h1>Nine reference motifs, stitched square for square</h1>
  <p>Your reference shapes on the portfolio’s stitch grid, with brighter duck, watermelon, and rose threads. Click a card to replay the stitching.</p>
  <div id="motifs"></div>
</main>
<script type="module">
  import { MOTIFS, createMotif } from '../motifs.mjs';
  import { SurfaceRenderer } from '../render.mjs';
  import { GRID } from '../model.mjs';
  import { cornerPitch } from '../corners.mjs';
  const renderer = Object.create(SurfaceRenderer.prototype);
  renderer.sprites = new Map();
  for (const motif of MOTIFS) {
    const button = document.createElement('button');
    button.setAttribute('aria-label', `Replay ${motif.name} stitches`);
    const pair = document.createElement('div'); pair.className = 'comparison';
    const sourcePane = document.createElement('div'); sourcePane.className = 'source-pane';
    const crop = document.createElement('div'); crop.className = 'source-crop';
    const reference = new Image(); reference.alt = `${motif.name} reference`;
    reference.src = `./motif-references/${motif.source.file}`;
    crop.append(reference); sourcePane.append(crop);
    const canvas = document.createElement('canvas');
    pair.append(sourcePane, canvas);
    const labels = document.createElement('div'); labels.className = 'labels';
    labels.innerHTML = '<span>Reference</span><span>Stitched</span>';
    const caption = document.createElement('small');
    const cells = createMotif(motif.id);
    caption.textContent = `${motif.columns} × ${motif.lines} · ${cells.length} stitches`;
    button.append(pair, labels, motif.name, caption);
    document.getElementById('motifs').append(button);
    const ctx = canvas.getContext('2d');
    let animation;
    function fitReference() {
      const { origin, pitch, crop: bounds } = motif.source;
      const sx = origin[0] + bounds[0] * pitch[0], sy = origin[1] + bounds[1] * pitch[1];
      const width = motif.columns * pitch[0], height = motif.lines * pitch[1];
      const scale = Math.min((sourcePane.clientWidth - 22) / width, 176 / height);
      crop.style.width = `${width * scale}px`; crop.style.height = `${height * scale}px`;
      Object.assign(reference.style, { width: `${reference.naturalWidth * scale}px`, height: `${reference.naturalHeight * scale}px`, left: `${-sx * scale}px`, top: `${-sy * scale}px` });
    }
    reference.addEventListener('load', fitReference);
    function draw(now = Infinity, started = 0) {
      const width = canvas.clientWidth, height = canvas.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, width, height);
      const pitch = cornerPitch(innerWidth), scale = pitch / GRID;
      const ox = width / 2 - pitch / 2, oy = height / 2 - pitch / 2;
      ctx.fillStyle = '#00000017';
      for (let y = oy % pitch; y < height; y += pitch) for (let x = ox % pitch; x < width; x += pitch) {
        ctx.beginPath(); ctx.arc(x, y, .48, 0, Math.PI * 2); ctx.fill();
      }
      ctx.translate(ox, oy); ctx.scale(scale, scale);
      for (const { col, row, color, delay } of cells) {
        const progress = Math.max(0, Math.min(1, (now - started - delay) / 280));
        if (progress) ctx.drawImage(renderer.sprite(color, ((col + row) % 4 + 4) % 4, progress), col * GRID - 5, row * GRID - 5, GRID + 10, GRID + 10);
      }
      if (now - started < 1050) animation = requestAnimationFrame(time => draw(time, started));
    }
    button.addEventListener('click', () => { cancelAnimationFrame(animation); const now = performance.now(); draw(now, now); });
    window.addEventListener('resize', () => { cancelAnimationFrame(animation); fitReference(); draw(); });
    draw();
  }
</script>
</html>
