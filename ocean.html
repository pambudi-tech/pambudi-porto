<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Ocean by BCA — product design, design systems, and a homepage revamp by Ivan Pambudi." />
  <title>Ocean by BCA — Ivan Pambudi</title>
  <link rel="preload" href="/assets/fonts/syne-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/postage-stamp.css" />
  <link rel="stylesheet" href="/src/styles/project-detail.css" />
  <link rel="stylesheet" href="/src/styles/project-transition.css" />
  <script type="module" src="/src/pages/project.mjs" blocking="render"></script>
</head>
<body class="project-arriving">
  <nav class="project-nav" aria-label="Project">
    <a class="project-nav-back" href="./#works" aria-label="Back to works">back</a>
    <span class="project-nav-name" data-project="title">Ocean by BCA</span>
  </nav>
  <div id="surface" aria-hidden="true" aria-busy="true">
    <canvas id="cloth" aria-hidden="true"></canvas>
    <canvas id="embroidery" aria-hidden="true"></canvas>
    <canvas id="gesture" aria-hidden="true"></canvas>
  </div>
  <a class="skip-link" href="#cover">Skip to hero image</a>
  <main class="project-layout">
    <header class="project-opening" aria-labelledby="project-title">
      <div class="project-info">
        <div class="project-intro">
          <h1 id="project-title" data-project="title">Ocean by BCA</h1>
          <p class="eyebrow" data-project="category"></p>
        </div>
        <dl class="project-facts">
          <div><dt>Client</dt><dd data-project="client"></dd></div>
          <div><dt>Period</dt><dd data-project="period"></dd></div>
          <div><dt>Role</dt><dd data-project="role"></dd></div>
          <div><dt>Scope</dt><dd data-project="scope"></dd></div>
        </dl>
      </div>
      <div class="project-cover"></div>
      <div class="project-overview">
        <p data-project="subtitle"></p>
        <p data-project="overview"></p>
      </div>
    </header>
  </main>
  <!-- Pinned to the bottom of the screen, above whatever scrolls beneath it. -->
  <button class="works-seal project-gallery-seal" type="button" aria-label="gallery">
    <img src="/assets/works-wax-seal.png" width="2076" height="758" alt="" aria-hidden="true" draggable="false" />
    <span class="works-seal-label">gallery</span>
  </button>

    <div id="stitch-controls" class="context-panel" role="dialog" aria-label="Stitch controls" data-mode="motif" hidden>
      <div class="tool-tray" role="toolbar" aria-label="Stitch tools">
        <div class="tool-group mode-tools">
          <button id="motif-tool" class="tool-button selected" aria-pressed="true" title="Click the surface to stitch a random motif">
            <svg viewBox="0 0 24 24"><path d="m6 6 5 5m0-5-5 5m7 2 5 5m0-5-5 5M13 6h5v5M6 13v5h5"/></svg>
            <span>Motif</span>
          </button>
          <button id="free-tool" class="tool-button" aria-pressed="false" title="Click or drag on the surface to draw individual stitches">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
            <span>Free stitch</span>
          </button>
        </div>
        <div id="free-options" class="free-options" aria-hidden="true" inert>
          <div class="free-options-inner">
            <div class="thread-palette" role="group" aria-label="Thread color"></div>
            <div class="free-action-row">
              <button id="unpick-tool" class="unpick-toggle" role="switch" aria-checked="false" title="Remove stitches instead of drawing">
                <span>Unpick</span><span class="switch-track" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
        <span class="separator"></span>
        <div class="tool-group history-tools">
          <button id="undo" class="tool-button" aria-label="Undo" title="Undo (⌘/Ctrl Z)" disabled>
            <svg viewBox="0 0 24 24"><path d="m9 6-4 4 4 4M5.5 10H14a5 5 0 0 1 0 10"/></svg>
            <span>Undo</span>
          </button>
          <button id="redo" class="tool-button" aria-label="Redo" title="Redo (⌘/Ctrl Shift Z)" disabled>
            <svg viewBox="0 0 24 24"><path d="m15 6 4 4-4 4m3.5-4H10a5 5 0 0 0 0 10"/></svg>
            <span>Redo</span>
          </button>
        </div>
      </div>
    </div>


  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
